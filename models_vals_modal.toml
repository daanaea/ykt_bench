# ---- community Sakha fine-tunes (open weights) ----
# Served with vLLM on one H200, original BF16 weights, reached through an SSH
# tunnel on 127.0.0.1:18000. Each model keeps its own chat template and default
# generation mode. LOCAL_INFERENCE_API_KEY is the local vLLM --api-key value.
# Qwen3.5-27B-sah ships the base Qwen3.5 generation_config.json (temperature 0.6,
# top_p 0.95, top_k 20, EOS <|im_end|> and <|endoftext|>). The other two merges
# dropped that file and stop only on <|endoftext|>, so the same base defaults
